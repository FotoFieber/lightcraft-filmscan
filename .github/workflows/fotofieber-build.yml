# LightCraft Film Scan (the FotoFieber fork) for macOS and Windows. Fork-only: it never goes upstream,
# where releases use storytold/craft-common-actions' release workflow with the official signing keys.
# Started by hand (packaging/fotofieber/fetch-builds.sh); it builds and uploads workflow artifacts and
# publishes nothing. packaging/fotofieber/publish.sh attaches them to the GitHub release.
name: Film Scan builds (macOS, Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fotofieber-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal
    # Intel: GitHub's Apple silicon runners were often unavailable; package.sh builds both architectures anyway.
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build
        run: packaging/fotofieber/build-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmscan-macos
          path: |
            dist/fotofieber/*-macos-universal.zip
            dist/fotofieber/BUILT_FROM-macos
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Build
        shell: pwsh
        run: ./packaging/fotofieber/build-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: filmscan-windows
          path: |
            dist/fotofieber/*-windows-x64.zip
            dist/fotofieber/BUILT_FROM-windows
          if-no-files-found: error
